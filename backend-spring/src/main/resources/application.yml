# ===================================================================
# Audique 2.0 - Spring Boot Configuration
# ===================================================================

server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: audique

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/audique}
    username: ${DB_USERNAME:audique}
    password: ${DB_PASSWORD:audique}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ===================================================================
# Groq API Configuration
# ===================================================================
groq:
  api-key: ${GROQ_API_KEY:}
  base-url: https://api.groq.com/openai/v1
  whisper-model: ${GROQ_WHISPER_MODEL:whisper-large-v3-turbo}
  llm-model: ${GROQ_LLM_MODEL:openai/gpt-oss-120b}
  timeout: 120

# ===================================================================
# Supabase Configuration
# ===================================================================
supabase:
  url: ${SUPABASE_URL:}
  anon-key: ${SUPABASE_ANON_KEY:}
  jwt-secret: ${SUPABASE_JWT_SECRET:}
  jwks-url: ${SUPABASE_JWKS_URL:}
  discovery-url: ${SUPABASE_DISCOVERY_URL:}
  jwt-issuer: ${SUPABASE_JWT_ISSUER:}
  storage-bucket: ${SUPABASE_STORAGE_BUCKET:audio-files}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

# ===================================================================
# Application Configuration
# ===================================================================
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}

# ===================================================================
# Actuator
# ===================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ===================================================================
# Logging
# ===================================================================
logging:
  level:
    com.audique: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

